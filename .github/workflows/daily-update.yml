name: Daily leaderboard update

# 11:40 UTC = 7:40am ET. Late enough that every West Coast game from the night
# before is final and posted to Savant, early enough that the board is fresh
# before anyone looks at it. Statcast revises recent days, which the fetcher
# handles by re-pulling any date window inside its OL_FRESH_DAYS horizon rather
# than trusting a cached one.
on:
  schedule:
    - cron: "40 11 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# A second run starting while the first is still deploying would race on the
# same shinyapps.io app, so newer runs wait rather than overlap.
concurrency:
  group: leaderboard-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90     # a cold first run pulls the whole season (~30 min)

    env:
      OL_RAW_DIR:    savant_data/mlb_raw
      OL_SEASONS:    "2026"
      OL_OUT_RDS:    mlb_outing_bundle_2026.rds
      OL_CODE_DIR:   .
      OL_DEPLOY_DIR: mlb_outing_deploy

    steps:
      - uses: actions/checkout@v4

      # NOTE: use-public-rspm is deliberately OFF.
      #
      # Turning it on installs fast binaries from Posit Package Manager, but
      # every package then carries `Repository: RSPM` in its DESCRIPTION, and
      # rsconnect writes that bare name into the deploy manifest. The
      # shinyapps.io build server cannot resolve it and dies with:
      #
      #   Unsupported url scheme: RSPM/src/contrib/data.table_1.18.6.1.tar.gz
      #
      # Mapping RSPM to a URL via options(repos=) in deploy.R does NOT fix it --
      # renv's snapshot doesn't pick that up. Installing from CRAN instead means
      # DESCRIPTION says `Repository: CRAN`, which the build server resolves on
      # its own. The cost is source builds, which setup-r-dependencies caches,
      # so only a cache-cold run pays it.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: false

      # cpp11 / Rcpp / later are build-only (LinkingTo) dependencies that pak
      # correctly skips when installing binaries, but rsconnect's renv snapshot
      # runs a pre-flight check that demands they be installed anyway. Without
      # cpp11 the deploy dies at "aborting snapshot due to pre-flight validation
      # failure - required package(s) not installed: cpp11", which isoband pulls
      # in via ggplot2. The other two are listed pre-emptively rather than found
      # one failed deploy at a time.
      #
      # These comments live OUTSIDE the packages block on purpose: `packages: |`
      # is a YAML literal block scalar, so a `#` line inside it is not a comment
      # -- it gets handed to pak as R code, which fails with "unexpected symbol".
      # Package names are listed WITHOUT pak's `any::` prefix on purpose.
      #
      # With `any::data.table`, pak records the install source as the ref "any",
      # and rsconnect's manifest then reads:
      #     data.table  Source: any  Repository: CRAN
      # Because the source is not recognised as CRAN, the repository is left as
      # the bare NAME instead of being resolved to a URL, and the shinyapps.io
      # build server dies with "Unsupported url scheme: CRAN/src/contrib/...".
      # Installed locally with plain install.packages(), the same package gives
      # Source: CRAN and a real Repository URL, which is what the server needs.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            data.table
            dplyr
            tidyr
            purrr
            stringr
            ggplot2
            shiny
            DT
            ggrepel
            rsconnect
            cpp11
            Rcpp
            later
            jsonlite

      - name: Restore Savant chunk cache
        uses: actions/cache@v4
        with:
          path: savant_data
          key: savant-2026-${{ github.run_id }}
          restore-keys: |
            savant-2026-

      - name: Fetch new pitch data
        run: Rscript mlb_savant_fetch.R 2026

      - name: Rebuild leaderboard
        run: Rscript mlb_outing_length.R

      - name: Build slim app bundle
        run: Rscript make_deploy.R 2026
        env:
          OL_SRC_BUNDLE: mlb_outing_bundle_2026.rds

      # Fails the run before touching shinyapps.io if any render path is broken,
      # so a bad bundle can never replace a working live app.
      - name: Smoke test the app
        run: Rscript smoke_test.R mlb_outing_deploy

      # RENV_CONFIG_REPOS_OVERRIDE is the load-bearing line here.
      #
      # rsconnect builds its manifest through renv, and renv resolves each
      # package's DESCRIPTION `Repository:` NAME into a URL using its OWN repos
      # config -- not getOption("repos") set inside deploy.R. When the lookup
      # fails it writes the bare name, and the shinyapps.io build server then
      # tries to fetch "CRAN/src/contrib/data.table_1.18.6.1.tar.gz" and dies
      # with "Unsupported url scheme". Identical failure appeared as
      # "RSPM/src/contrib/..." while installing from Posit Package Manager, which
      # is what proves it is a name-resolution bug rather than a bad repo choice.
      #
      # This env var forces renv to use a real URL, and being an env var it
      # survives into whatever process renv runs the snapshot in.
      - name: Deploy to shinyapps.io
        run: Rscript deploy.R
        env:
          RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org
          SHINY_ACCOUNT:  ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINY_TOKEN:    ${{ secrets.SHINYAPPS_TOKEN }}
          SHINY_SECRET:   ${{ secrets.SHINYAPPS_SECRET }}
          SHINY_APP_NAME: mlb-outing-length

      - name: Summary
        if: always()
        run: |
          {
            echo "### Leaderboard update"
            echo ""
            Rscript -e '
              b <- readRDS("mlb_outing_deploy/data/bundle.rds")
              d <- as.data.frame(b$board)
              d <- d[order(-d$xouts), ][1:5, c("name","starts","xouts","rv100")]
              cat("Qualified starters:", nrow(b$board), "\n\n")
              cat("| Pitcher | GS | xIP/st | RS/100 |\n|---|---|---|---|\n")
              for (i in 1:5) cat(sprintf("| %s | %d | %.2f | %+.2f |\n",
                d$name[i], d$starts[i], d$xouts[i]/3, d$rv100[i]))' 2>/dev/null || echo "(bundle unavailable)"
          } >> "$GITHUB_STEP_SUMMARY"
